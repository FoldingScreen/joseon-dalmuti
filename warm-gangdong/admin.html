<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강동 온도계</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="screen-page">
  <main class="screen-layout">
    <section class="main-stage">
      <div class="top-title">
        <div>
          <p>강동구 나눔 협동게임</p>
          <h1>사랑의 온도 올리기</h1>
        </div>
        <div class="admin-controls">
          <button id="createRoomBtn">새 행사 시작</button>
          <button id="resetRoomBtn">초기화</button>
        </div>
      </div>

      <div class="temperature-zone">
        <div class="thermometer">
          <div class="thermo-track"><div id="thermoFill"></div></div>
          <div class="thermo-bulb"></div>
        </div>
        <div class="temperature-info">
          <span>현재 온도</span>
          <strong id="temperatureText">0%</strong>
          <p id="totalFanText">전체 부채질 0회</p>
        </div>
      </div>

      <div class="fire-wrap">
        <div id="fire" class="fire">🔥</div>
        <div id="windLayer"></div>
      </div>
    </section>

    <aside class="right-panel">
      <section class="qr-card">
        <p>참여 QR</p>
        <strong id="roomCodeText">-----</strong>
        <img id="qrImage" alt="QR" />
      </section>

      <section class="ranking-card">
        <h2>실시간 랭킹</h2>
        <ol id="rankingList"></ol>
      </section>
    </aside>
  </main>

  <section id="successOverlay" class="success-overlay hidden">
    <div class="success-box">
      <h2>🎉 성공!</h2>
      <p>여러분의 나눔으로 강동구가 조금 더 따뜻해졌습니다.</p>
    </div>
  </section>

</html>
