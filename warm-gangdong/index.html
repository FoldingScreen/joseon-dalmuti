<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>강동 온도계 참여</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="player-page">
  <main class="player-card">
    <p class="eyebrow">강동구 나눔 협동게임</p>
    <h1>모닥불 부채질</h1>
    <p id="playerRoomText">접속 코드 확인 중</p>

    <label>내 이름</label>
    <input id="nicknameInput" maxlength="12" placeholder="닉네임 입력" />

    <button id="fanButton" class="fan-button">
      <span>🪭</span>
      부채질!
    </button>

    <div class="score-row"><span>내 부채질</span><strong id="myFanText">0회</strong></div>
    <div class="score-row"><span>전체 온도</span><strong id="miniProgressText">0%</strong></div>

    <div class="mini-progress"><div id="miniProgressFill"></div></div>
    <p id="playerStatusText">버튼을 눌러 강동구의 온도를 올려주세요.</p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
